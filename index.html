<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      tdk's poorly made github homepage so it doesn't just throw a 404
    </title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url("media/derp_shinobu.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: Arial, sans-serif;
      }

      .card {
        background-color: #2b2b2bd2;
        padding: 32px 24px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        text-align: center;
        width: 90%;
        max-width: 320px;
      }

      .pfp {
        width: 120px;
        height: 120px;
        object-fit: cover;
        display: block;
        margin: 0 auto;
      }

      .username {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        color: #ffffff;
        font-size: 1.5rem;
        margin: 16px 0 20px 0;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .links a {
        color: #ffffff;
        text-decoration: none;
        font-size: 1rem;
      }

      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="media/renge.png" alt="renge" class="pfp" />

      <h1 class="username">tdk</h1>

      <div class="links">
        <a href="https://x.com/tdkumon" target="_blank">twitter</a>
        <a href="tracking-sheet/" target="_blank">tracking sheet</a>
        <a href="progress-log/" target="_blank">progress log</a>
      </div>
    </div>
  </body>
</html>
